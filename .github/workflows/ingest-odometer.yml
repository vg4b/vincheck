name: Ingest odometer (ISTP)

# Keeps the odometer cache (vehicle_inspection_odometer) current from the ISTP
# open data. The source publishes each day's file with a ~2-3 week lag (and can
# stall far longer — it went dark 2026-06-06 → mid-July), so a daily run would
# add no freshness while multiplying DB load. Instead we run WEEKLY and resume
# from the newest day we already hold (see "Compute window start"), which absorbs
# a lag of any length. The load is idempotent (download skips existing within a
# run; ingest UPSERTs on cislo_protokolu) and never touches the other cache
# tables.
#
# Since migration 007 each record also carries its STK defect list (codes +
# severities + A/B/C counts) plus RozsahProhlidky / EmisniSystem, so this job
# keeps the DEFECT history current too — the parser fills those columns on every
# UPSERT. Nothing extra to run; the guard at the end fails the job if they ever
# stop arriving.
#
# Required secret: SCALEWAY_ADMIN_DATABASE_URL — the admin connection string
#   (postgres://<admin>:<pw>@<host>:<port>/rdb?sslmode=require). Read+write.

on:
  schedule:
    # Mondays 03:30 UTC — off-peak, after the source's weekly publishes.
    - cron: '30 3 * * 1'
  workflow_dispatch:
    inputs:
      from:
        description: 'Override --from date (YYYY-MM-DD). Default: 35 days ago.'
        required: false

# Never let two ingests overlap on the shared DB node.
concurrency:
  group: ingest-odometer
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # These scripts only need pg + tsx. Install ONLY those: temporarily hide
      # package.json so npm doesn't pull the whole CRA dependency tree (~1600
      # packages) into the runner — just pg + tsx land in ./node_modules, which is
      # where the scripts in scripts/ resolve their imports from.
      - name: Install pg + tsx only
        run: |
          mv package.json _package.json
          npm install --no-save --no-package-lock --no-audit --no-fund pg tsx
          mv _package.json package.json

      # Anchor the window to the DATA, not the wall clock. A fixed "35 days ago"
      # start silently loses days whenever the source stalls longer than the
      # window: it slid past our newest reading during the 2026-06/07 ISTP
      # outage, so a catch-up backfill would have been skipped for good while the
      # job still went green. Instead we resume from the newest day we already
      # hold (cache_meta.source_snapshot — a GREATEST() high-water mark, O(1) to
      # read) minus OVERLAP_DAYS. Re-processing those days is free: the ingest
      # UPSERTs on cislo_protokolu. Empty table / unreachable DB falls back to
      # the old 35-day window.
      - name: Compute window start
        id: win
        env:
          DATABASE_URL: ${{ secrets.SCALEWAY_ADMIN_DATABASE_URL }}
          OVERLAP_DAYS: '7'
        run: |
          FROM="${{ github.event.inputs.from }}"
          if [ -z "$FROM" ]; then
            # Subtract the overlap in Postgres, not in `date` — one round trip,
            # no shell date-string parsing to get wrong.
            FROM=$(psql "$DATABASE_URL" -tAc \
              "SELECT (source_snapshot - MAKE_INTERVAL(days => $OVERLAP_DAYS))::date
                 FROM cache_meta WHERE dataset = 'odometer'" 2>/dev/null | tr -d '[:space:]' || true)
            if [ -n "$FROM" ]; then
              echo "Resuming $OVERLAP_DAYS days before the odometer high-water mark"
            else
              FROM=$(date -u -d '35 days ago' +%F)
              echo "No high-water mark (empty table / DB unreachable) — falling back to a 35-day window"
            fi
          fi
          echo "from=$FROM" >> "$GITHUB_OUTPUT"
          echo "Ingesting from $FROM"

      # Retry: the catalogue lives on data.gov.cz's public SPARQL endpoint, which
      # returns transient errors often enough to matter — it took the scheduled
      # 2026-08-10 run down after 16s and needed a manual re-dispatch. A weekly
      # job should absorb a blip rather than page a human for one.
      - name: Crawl catalog
        run: |
          for attempt in 1 2 3; do
            npx tsx scripts/crawl-odometer-catalog.ts --out odometer-data/manifest.json && exit 0
            echo "crawl attempt $attempt failed; retrying in $((attempt * 30))s"
            sleep $((attempt * 30))
          done
          echo "::error::Catalogue crawl failed three times — data.gov.cz SPARQL endpoint is likely down."
          exit 1

      - name: Download new files
        run: >
          npx tsx scripts/download-odometer.ts
          --manifest odometer-data/manifest.json
          --dir odometer-data/xml
          --from ${{ steps.win.outputs.from }}
          --concurrency 6

      # Output is teed to a file so the defect guard below can assert on the
      # counts this run actually produced. `pipefail` is required: without it
      # the step's exit status would come from `tee` and a failed ingest would
      # pass.
      - name: Ingest into Scaleway
        env:
          DATABASE_URL: ${{ secrets.SCALEWAY_ADMIN_DATABASE_URL }}
        run: |
          set -o pipefail
          npx tsx scripts/ingest-odometer.ts \
            --apply-schema \
            --dir odometer-data/xml \
            --from ${{ steps.win.outputs.from }} \
            --throttle 25 | tee ingest.log

      # A stalled upstream feed is invisible from the outside: the crawl still
      # succeeds, there is simply nothing newer to fetch, the overlap window is
      # re-ingested and the job goes green. That is exactly how ISTP publishing
      # nothing after 2026-07-03 went unnoticed for five weeks — every weekly run
      # in between passed. Compare the newest published day against the run date
      # and fail loudly. The ingest above has already completed by this point;
      # this step changes no data and only raises the flag.
      - name: Check the upstream feed is still publishing
        env:
          # 28, not 21. ISTP publishes in bursts, so the lag sawtooths rather
          # than sitting at a constant: the healthy 2026-08-17 run measured 20
          # days (one day short of failing), and two days later the same feed
          # measured 12. A 21-day threshold is the documented *normal* lag, so
          # it fires on ordinary operation. 28 keeps a week of headroom and
          # still catches a real stall long before it matters — the 2026-06/07
          # outage ran five weeks.
          MAX_LAG_DAYS: '28'
        run: |
          NEWEST=$(node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('odometer-data/manifest.json','utf8'));console.log(m.map(e=>e.date).sort().pop())")
          LAG=$(( ( $(date -u +%s) - $(date -u -d "$NEWEST" +%s) ) / 86400 ))
          echo "Newest day published by ISTP: $NEWEST ($LAG days ago, threshold $MAX_LAG_DAYS)"
          if [ "$LAG" -gt "$MAX_LAG_DAYS" ]; then
            echo "::error::ISTP has published no inspection data since $NEWEST — $LAG days ago. Vehicles inspected since then carry no odometer reading in the certificate. The ingest itself succeeded; this is an upstream stall, not a failure of this job."
            exit 1
          fi

      # The defect columns (migration 007) are filled by the same parser pass as
      # the odometer, so a schema change upstream — ISTP renaming <Zavada>, or
      # moving it out of <Vysledek> — would NOT fail anything: the regex would
      # simply match nothing and every new row would get zero defects while the
      # job stayed green and the site quietly showed "bez závad" for cars that
      # failed their inspection.
      #
      # Asserted from the ingest's own `stats:` line rather than by querying the
      # database. The DB has no index on inspection_date, so the equivalent
      # query is a sequential scan of all 91.9M rows (~24 GB, measured at 2m25s
      # against a 5m26s ingest) on the shared production node, every week, to
      # recompute a number the parser already reported. Both answers come from
      # the same UPSERTed rows, and a write that failed would fail the step
      # above, so the cheap one carries the same signal.
      #
      # The share of inspections carrying defects has stepped DOWN twice as the
      # rules changed — 56% (2016-17) → 35% (2018-23, after vyhláška 211/2018)
      # → 25% (2024+) — so the floor is deliberately well below today's 25%
      # rather than near it: another step-down must not page anyone. A broken
      # parser produces 0%, which this still catches decisively.
      - name: Check defect data is still being parsed
        env:
          MIN_DEFECT_PCT: '10'
        run: |
          LINE=$(grep -o 'stats: records=[0-9]* with_defects=[0-9]* defects=[0-9]*' ingest.log | tail -1)
          if [ -z "$LINE" ]; then
            echo "::error::The ingest printed no machine-readable 'stats:' line. Either it did not complete, or that line was removed from scripts/ingest-odometer.ts without updating this guard."
            exit 1
          fi
          ROWS=$(echo "$LINE" | sed -E 's/.*records=([0-9]*).*/\1/')
          WITH=$(echo "$LINE" | sed -E 's/.*with_defects=([0-9]*).*/\1/')
          if [ "$ROWS" -eq 0 ]; then
            echo "No records in the window — nothing to assert (an upstream stall is reported by the step above)."
            exit 0
          fi
          PCT=$(( 100 * WITH / ROWS ))
          echo "Window from ${{ steps.win.outputs.from }}: $ROWS records, $WITH with defects = $PCT% (floor $MIN_DEFECT_PCT%)"
          if [ "$PCT" -lt "$MIN_DEFECT_PCT" ]; then
            echo "::error::Only $PCT% of the $ROWS inspections ingested since ${{ steps.win.outputs.from }} carry defect codes (expected ~25%). The defect parser in scripts/ingest-odometer.ts has most likely stopped matching — check whether ISTP changed the <Zavada> element. Odometer data is unaffected."
            exit 1
          fi
